# CI de todo PR: build, testes, validação de schema, Lighthouse CI (bloqueante) e npm audit.
# A branch main é protegida: só entra PR com este workflow verde.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm --filter @saltao/site check
      - name: Build (dados de exemplo — sem STRAPI_URL)
        run: pnpm --filter @saltao/site build
      - name: Testes do build (SEO, JSON-LD, hreflang, sitemap, robots, llms.txt, .htaccess, peso de JS, 301)
        run: pnpm --filter @saltao/site test
      - name: Lighthouse CI (mobile, ≥ 95 nas 4 categorias, LCP ≤ 1,8 s, CLS ≤ 0,05)
        working-directory: apps/site
        run: npx -y @lhci/cli@0.16.x autorun
      - name: npm audit
        run: pnpm audit --prod --audit-level high

  painel:
    name: Painel (Strapi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/painel/package-lock.json
      - run: npm ci
      - name: Build (TS + admin)
        run: npm run build
      - name: Sobe e valida os schemas (boot com SQLite)
        env:
          DATABASE_CLIENT: sqlite
          APP_KEYS: ci1,ci2
          API_TOKEN_SALT: ci
          ADMIN_JWT_SECRET: ci
          TRANSFER_TOKEN_SALT: ci
          JWT_SECRET: ci
          ENCRYPTION_KEY: ci
        run: |
          npx strapi start > strapi.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:1337/_health && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:1337/_health || (cat strapi.log; exit 1)
          ! grep -E "\berror\b" strapi.log
      - name: npm audit
        run: npm audit --omit=dev --audit-level high

  plataforma:
    name: Plataforma (motor de reservas)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: saltao_plataforma_test
          MARIADB_USER: saltao
          MARIADB_PASSWORD: saltao
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saltao/plataforma check
      - name: Testes obrigatórios do motor (concorrência, hold, webhook, voucher)
        env:
          DATABASE_URL_TEST: mysql://saltao:saltao@127.0.0.1:3306/saltao_plataforma_test
        run: pnpm --filter @saltao/plataforma test
